<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Hoja / blade -->
  <path d="M8 32 L52 20 L54 24 L14 38 Z" fill="url(#blade-gradient)" rx="1"/>
  <!-- Filo / cutting edge highlight -->
  <path d="M8 32 L52 20 L51 21.5 L10 35 Z" fill="#F5F0E0" opacity="0.6"/>
  <!-- Punta / tip detail -->
  <path d="M50 20 L54 22 L54 24 L50 22 Z" fill="#E8D8A0"/>
  <!-- Cachas / handle -->
  <rect x="6" y="32" width="18" height="9" rx="3" fill="url(#handle-gradient)" transform="rotate(-14 15 36.5)"/>
  <!-- Detalle cachas (vein) -->
  <line x1="9" y1="34" x2="22" y2="30" stroke="#6B3A1F" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
  <line x1="9" y1="36.5" x2="22" y2="32.5" stroke="#6B3A1F" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
  <!-- Muelle / spring back -->
  <rect x="5" y="31" width="4" height="2.5" rx="1" fill="#C9A84C" transform="rotate(-14 7 32.25)"/>
  <!-- Remaches / rivets -->
  <circle cx="11" cy="35.5" r="1.2" fill="#C9A84C" transform="rotate(-14 11 35.5)"/>
  <circle cx="19" cy="33" r="1.2" fill="#C9A84C" transform="rotate(-14 19 33)"/>

  <defs>
    <linearGradient id="blade-gradient" x1="8" y1="26" x2="54" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C0BBAA"/>
      <stop offset="40%" stop-color="#E8E0C8"/>
      <stop offset="70%" stop-color="#D4CCB0"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <linearGradient id="handle-gradient" x1="6" y1="32" x2="24" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#6B3010"/>
      <stop offset="100%" stop-color="#4A1F08"/>
    </linearGradient>
  </defs>
</svg>
